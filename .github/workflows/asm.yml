name: asm

# The retargetable assembler in asm/ (see .ai/asm_plan.md). It is a standalone
# dune project with no dependency on the CompCert build, so this workflow never
# configures or compiles CompCert and needs neither Rocq nor a cross toolchain.
#
# It runs on the full image matrix rather than one leg: §11.6 requires the
# production closure to build everywhere, and the 32-bit linux/i386 and
# linux/arm/v7 legs are the ones that matter most for Bigint, whose limb base is
# chosen for their 31-bit native int.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  versions:
    uses: ./.github/workflows/ocaml-versions.yml
  asm:
    needs: versions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.versions.outputs.images_matrix) }}
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: ./.github/workflows/actions/devcontainer
      id: devcontainer
      env:
        OCAML_VERSION: ${{ matrix.ocaml_version }}
      with:
        variant: ${{ matrix.ocaml_version }}
        platform: ${{ matrix.platform }}
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    # Checked first and on every leg. asm/.ocamlformat pins `version = 0.28.1`,
    # so ocamlformat refuses to run at all against a different binary - which
    # makes this also the check that devcontainer.json's ocamlformat pin is
    # actually what each image ships.
    - name: fmt-check
      run: |
        ${{ env.EXEC }} make asm-fmt-check
    - name: build
      run: |
        ${{ env.EXEC }} make asm-build
    - name: fixtures
      run: |
        ${{ env.EXEC }} make asm-fixtures-check
    - name: test
      run: |
        ${{ env.EXEC }} make asm-test
    - name: purity and layers
      run: |
        ${{ env.EXEC }} make asm-purity
    - name: planted violations
      run: |
        ${{ env.EXEC }} make asm-planted
    # js_of_ocaml compilation and Node equality on every leg but the two
    # 32-bit ones. The Melange leg cannot run here - Melange 7.0.1-414
    # requires `ocaml >= 4.14 & < 4.15`, so it would make every 5.x image
    # unsatisfiable - and it has its own job below; but leaving jsoo out too
    # would mean the only evidence that the production closure compiles to
    # JavaScript came from one pinned leg. linux/i386 and linux/arm/v7 are
    # skipped because the devcontainer image installs Node only for
    # amd64/arm64 (upstream ships no linux-x86 build at all - dropped long
    # ago - and skipping the armv7l one too keeps both 32-bit legs on the
    # same simple rule rather than growing a special case), so there is no
    # `node` to run this against on those two legs.
    - name: js_of_ocaml equality
      if: matrix.platform != 'linux/i386' && matrix.platform != 'linux/arm/v7'
      run: |
        ${{ env.EXEC }} make asm-js-portable
    # The Melange opt-in itself, which needs no Melange: it asserts that with
    # ASM_MELANGE unset `dune rules @all` schedules zero melc rules. That is the
    # check that catches a mis-gated stanza *here*, on an image where Melange
    # cannot be installed, rather than only on the pinned leg.
    - name: melange opt-in
      run: |
        ${{ env.EXEC }} make asm-melange-optin

# ABI v1 regression plus the shared-source v2 legacy-profile conformance suite.
# Its own job, and
  # deliberately not part of the matrix above: it assembles the four helpers
  # with the cross binutils and executes them under the four qemu-user
  # binaries, none of which the 32-bit legs have. Keeping it out is what
  # lets `make asm-test` stay free of any cross-toolchain or QEMU dependency
  # (guardrail 4) while conformance still blocks.
  #
  # It needs no CompCert installation at all, so it is far cheaper than the
  # full oracle job and can stay required.
  abi-conform:
    runs-on: ubuntu-24.04
    env:
      OCAML_VERSION: 5.5.0
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: ./.github/workflows/actions/devcontainer
      id: devcontainer
      with:
        variant: ${{ env.OCAML_VERSION }}
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: helpers
      run: |
        ${{ env.EXEC }} make asm-helpers
    # Every case checks an exact outcome, and the driver additionally fails if
    # any subcode §14.2 promises is neither observed by a case nor covered by a
    # recorded exemption - so a check that becomes unreachable fails here rather
    # than passing quietly.
    #
    # M1.6 runs in the same step rather than a second one, because asm-exec
    # already depends on asm-abi-conform: E5 is not a claim worth making until
    # E4 holds, and the make graph is where that edge belongs - two CI steps in
    # a chosen order could be reordered without anything noticing.
    - name: conformance and execution
      run: |
        ${{ env.EXEC }} make asm-exec

  # The behavioral tool gate (§3.2). Its own job because what it checks is the
  # *container*, not the code: APT tooling is range-checked rather than
  # digest-pinned, so a base-image update that moved QEMU, GDB or binutils under
  # us has to surface here rather than as a puzzling failure somewhere else. It
  # needs no CompCert and no part of the assembler - it establishes E2 tool
  # compatibility only, and abi-conform above remains the distinct E4 proof.
  tool-gate:
    runs-on: ubuntu-24.04
    env:
      OCAML_VERSION: 5.5.0
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: ./.github/workflows/actions/devcontainer
      id: devcontainer
      with:
        variant: ${{ env.OCAML_VERSION }}
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: tool gate
      run: |
        ${{ env.EXEC }} make asm-tool-gate

  # Freestanding CompCert regeneration and GNU/QEMU differential gate.  The
  # profiles are independent jobs: neither a libc nor the other XLEN's ccomp
  # installation is a prerequisite for reproducing one committed corpus.
  riscv-oracle:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [riscv32, riscv64]
    env:
      OCAML_VERSION: 5.5.0
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: ./.github/workflows/actions/devcontainer
      id: devcontainer
      with:
        variant: ${{ env.OCAML_VERSION }}
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: build freestanding CompCert profile
      run: |
        ${{ env.EXEC }} tools/compcert-riscv-fixture-setup.sh ${{ matrix.target }}
    - name: regenerate and compare source assembly
      run: |
        ${{ env.EXEC }} tools/asm-fixture-gen.sh --verify ${{ matrix.target }}
    - name: GNU differential artifacts and QEMU execution
      run: |
        ${{ env.EXEC }} tools/asm-fixture-oracle.sh ${{ matrix.target }}
        ${{ env.EXEC }} tools/asm-riscv-exec.sh ${{ matrix.target }}
        git diff --exit-code -- asm/fixtures/compcert-3.17
    - name: provenance and summaries
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: riscv-oracle-${{ matrix.target }}-provenance
        path: |
          .cross-smoke-work/artifacts/${{ matrix.target }}/
          .riscv-exec-artifacts/${{ matrix.target }}/
          asm/fixtures/compcert-3.17/*/${{ matrix.target }}/oracle/tool-versions.txt
          asm/fixtures/compcert-3.17/*/${{ matrix.target }}/oracle/linked/manifest.txt
    - name: complete failure evidence
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: riscv-oracle-${{ matrix.target }}-failure
        path: |
          .cross-smoke-work/artifacts/${{ matrix.target }}/
          .riscv-exec-artifacts/${{ matrix.target }}/
          asm/fixtures/compcert-3.17/*/${{ matrix.target }}/

  # Byte-identical output from native OCaml, js_of_ocaml/Node, and Melange/Node
  # (.ai/asm_plan.md §11.6). Its own job on one pinned leg, because Melange
  # 5.1.0-414 requires `ocaml >= 4.14 & < 4.15` and so cannot be installed on
  # the OCaml 5.x images the matrix above also builds.
  three-build:
    runs-on: ubuntu-24.04
    env:
      OCAML_VERSION: 4.14.3
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: ./.github/workflows/actions/devcontainer
      id: devcontainer
      with:
        variant: ${{ env.OCAML_VERSION }}
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    # devcontainer.json lists Melange under `optional-packages`, not `packages`:
    # the same devcontainer.json builds images for OCaml 4.14.3 through 5.5.0
    # and Melange's OCaml upper bound would make every 5.x image unsatisfiable,
    # so the feature installs it only where opam reports it available. On this
    # pinned 4.14 leg that is already the case; the step below is what makes the
    # job fail loudly here if it ever stops being installable.
    - name: install melange
      run: |
        ${{ env.EXEC }} opam install -y melange
    - name: three-build equality
      run: |
        ${{ env.EXEC }} make asm-js
